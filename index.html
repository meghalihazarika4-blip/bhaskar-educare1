<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhaskar Educare</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fc;color:#172033}header{background:#1746a2;color:white;padding:15px 18px}.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:800}.logo span{color:#ffd43b}.btn{border:0;border-radius:9px;padding:11px 16px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.admin{background:#f59e0b;color:#172033}.hero{padding:45px 20px;background:#eaf2ff}.wrap{max-width:1100px;margin:auto}.hero h1{font-size:48px}.section{padding:35px 20px}.grid,.items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.classes{grid-template-columns:repeat(5,1fr)}.card{background:white;border:1px solid #e0e6ef;border-radius:14px;padding:18px}.class{text-align:center;font-weight:bold;cursor:pointer}.class:hover{background:#2563eb;color:white}.hidden{display:none}.back{color:#2563eb;font-weight:bold;cursor:pointer;margin-bottom:15px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.modalbox{background:white;border-radius:16px;padding:22px;width:100%;max-width:650px;max-height:90vh;overflow:auto}.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd5e2;border-radius:8px}.close{float:right;background:#ddd;color:#222}.admin-item{padding:12px;background:#fafafa;border:1px solid #ddd;border-radius:8px;margin:8px 0}footer{background:#0c1d43;color:white;text-align:center;padding:22px}@media(max-width:700px){.grid,.items,.classes{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid,.items,.classes{grid-template-columns:1fr}.hero h1{font-size:38px}}
</style></head><body>
<header><div class="nav"><div class="logo">Bhaskar <span>Educare</span></div><button class="btn admin" onclick="openAdmin()">🔐 Admin</button></div></header>
<section class="hero"><div class="wrap"><b>📚 Smart Learning Platform</b><h1>Learn Better. Dream Bigger.</h1><p>Class 2–10 notes, Q&A, MCQs, PDFs and videos.</p><a class="btn" href="#classes">Start Learning</a></div></section>
<section class="section" id="classes"><div class="wrap"><h2>Select Your Class</h2><div class="grid classes" id="classGrid"></div></div></section>
<section class="section hidden" id="subjects"><div class="wrap"><div class="back" onclick="show('classes')">← Back</div><h2 id="subjectTitle"></h2><div class="items" id="subjectGrid"></div></div></section>
<section class="section hidden" id="chapters"><div class="wrap"><div class="back" onclick="show('subjects')">← Back</div><h2 id="chapterTitle"></h2><div class="items" id="chapterGrid"></div></div></section>
<section class="section hidden" id="materials"><div class="wrap"><div class="back" onclick="show('chapters')">← Back</div><h2 id="materialTitle"></h2><div class="items" id="materialGrid"></div></div></section>
<div class="modal" id="adminModal"><div class="modalbox"><button class="btn close" onclick="closeAdmin()">Close</button><h2>🔐 Admin Panel</h2><p>Add content to this browser.</p>
<label>Class</label><select id="aClass"></select><label>Subject</label><input id="aSubject" placeholder="Mathematics"><label>Chapter</label><input id="aChapter" placeholder="Trigonometry"><label>Type</label><select id="aType"><option>Notes</option><option>Question & Answer</option><option>MCQ</option><option>PDF Link</option><option>Video Link</option></select><label>Title</label><input id="aTitle" placeholder="Title"><label>Content / URL</label><textarea id="aContent" rows="7" placeholder="Write notes or paste a URL"></textarea><button class="btn" onclick="addContent()">➕ Add Content</button><div id="adminList"></div></div></div>
<footer>© 2026 Bhaskar Educare</footer>
<script>
const subjects=["Assamese","English","Mathematics","General Science","Social Science"],baseCh=["Chapter 1","Chapter 2","Chapter 3","Important Questions"];let data=JSON.parse(localStorage.getItem("bhaskarContent")||"[]"),cls="",sub="",chap="";const $=x=>document.getElementById(x);
function show(id){["classes","subjects","chapters","materials"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");}
function init(){for(let i=2;i<=10;i++){let d=document.createElement("div");d.className="card class";d.textContent="Class "+i;d.onclick=()=>openClass(i);$("classGrid").appendChild(d);$("aClass").innerHTML+=`<option>Class ${i}</option>`}}
function openClass(i){cls="Class "+i;$("subjectTitle").textContent=cls+" — Subjects";$("subjectGrid").innerHTML="";subjects.forEach(s=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<h3>📘 ${s}</h3><p>Open subject</p>`;d.onclick=()=>openSubject(s);$("subjectGrid").appendChild(d)});show("subjects")}
function openSubject(s){sub=s;$("chapterTitle").textContent=cls+" → "+sub;let list=[...new Set(baseCh.concat(data.filter(x=>x.cls==cls&&x.sub==sub).map(x=>x.chap)))];$("chapterGrid").innerHTML="";list.forEach(c=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<h3>📖 ${c}</h3>`;d.onclick=()=>openChapter(c);$("chapterGrid").appendChild(d)});show("chapters")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openChapter(c){chap=c;$("materialTitle").textContent=`${cls} → ${sub} → ${chap}`;let a=data.filter(x=>x.cls==cls&&x.sub==sub&&x.chap==chap);$("materialGrid").innerHTML=a.length?a.map(x=>`<div class="card"><h3>${esc(x.type)}: ${esc(x.title)}</h3><p>${x.type.includes("Link")?`<a class="btn" href="${esc(x.content)}" target="_blank">Open</a>`:esc(x.content).replace(/\n/g,"<br>")}</p></div>`).join(""):'<div class="card"><h3>No content yet</h3><p>Use Admin to add material.</p></div>';show("materials")}
function openAdmin(){$("adminModal").style.display="flex";renderAdmin()}function closeAdmin(){$("adminModal").style.display="none"}
function addContent(){let x={cls:$("aClass").value,sub:$("aSubject").value.trim(),chap:$("aChapter").value.trim(),type:$("aType").value,title:$("aTitle").value.trim(),content:$("aContent").value.trim()};if(!x.sub||!x.chap||!x.title||!x.content)return alert("Fill all fields");data.push(x);localStorage.setItem("bhaskarContent",JSON.stringify(data));alert("Added on this browser.");renderAdmin();["aSubject","aChapter","aTitle","aContent"].forEach(i=>$(i).value="")}
function renderAdmin(){$("adminList").innerHTML="<h3>Added content</h3>"+(data.length?data.map((x,i)=>`<div class="admin-item">${esc(x.cls)} → ${esc(x.sub)} → ${esc(x.chap)}<br>${esc(x.type)}: ${esc(x.title)}<br><button class="btn" onclick="del(${i})">Delete</button></div>`).join(""):"<p>No content yet.</p>")}
function del(i){data.splice(i,1);localStorage.setItem("bhaskarContent",JSON.stringify(data));renderAdmin()}init();
</script></body></html>
