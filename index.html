<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhaskar Educare Admin</title><style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}.top{background:#123d91;color:#fff;padding:18px}.wrap{max-width:850px;margin:auto}.panel{background:#fff;margin:20px auto;padding:22px;border-radius:16px}input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd5e2;border-radius:8px}.btn{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:bold}.danger{background:#dc2626}.item{padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}.price{font-weight:bold;color:#16803c}</style></head><body>
<div class="top"><div class="wrap"><h1>🔐 Bhaskar Educare Admin</h1><a style="color:#fff" href="../student/">← Student Website</a></div></div>
<main class="wrap"><div class="panel"><h2>Add / Publish Material</h2><label>Class</label><select id="c"></select><label>Subject</label><input id="s" placeholder="Mathematics"><label>Chapter</label><input id="h" placeholder="Trigonometry"><label>Title</label><input id="t" placeholder="Trigonometry PDF"><label>Type</label><select id="k"><option>PDF</option><option>Notes</option><option>Question & Answer</option><option>MCQ</option><option>Video</option></select><label>Price (₹)</label><input id="p" type="number" min="0" step="1" value="0"><label>Resource URL</label><input id="u" placeholder="https://..."><button class="btn" onclick="add()">➕ Publish</button><p><small>₹0 = Free. Any positive price = Paid. Payment is a demo until a real backend/payment gateway is connected.</small></p></div><div class="panel"><h2>Published Materials</h2><div id="list"></div></div></main>
<script>
const $=x=>document.getElementById(x);let D=JSON.parse(localStorage.getItem("bhaskarV4")||"[]");for(let i=2;i<=10;i++)$("c").innerHTML+="<option>Class "+i+"</option>";
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function add(){let x={c:$("c").value,s:$("s").value.trim(),h:$("h").value.trim(),t:$("t").value.trim(),k:$("k").value,p:Number($("p").value||0),u:$("u").value.trim(),y:"Resource"};if(!x.s||!x.h||!x.t||!x.u)return alert("Fill Subject, Chapter, Title and URL.");D.push(x);localStorage.setItem("bhaskarV4",JSON.stringify(D));alert("Published on this browser.");["s","h","t","u"].forEach(i=>$(i).value="");render()}
function del(i){D.splice(i,1);localStorage.setItem("bhaskarV4",JSON.stringify(D));render()}
function render(){$("list").innerHTML=D.length?D.map((x,i)=>"<div class=item><b>"+esc(x.c)+" → "+esc(x.s)+" → "+esc(x.h)+"</b><br>"+esc(x.t)+" — <span class=price>"+(x.p?"₹"+x.p:"FREE")+"</span><br><button class='btn danger' onclick='del("+i+")'>Delete</button></div>").join(""):"<p>No materials yet.</p>"}render();
</script></body></html>
